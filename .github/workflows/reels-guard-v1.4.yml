name: Build Reels Guard v1.4

on:
  push:
    branches: [reels-guard-v1.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle --no-daemon :reelsguard:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reels-Guard-v1.4-debug
          path: reelsguard/build/outputs/apk/debug/reelsguard-debug.apk
          if-no-files-found: error
