plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.reelsguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.reelsguard'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
